<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S1 Living On Your Style - Welcome</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }
        .container {
            position: relative;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 25px 20px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 2;
        }
        .logo {
            font-size: 34px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #d4af37;
            margin-bottom: 2px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        h2 {
            font-size: 15px;
            color: #f3e5ab;
            margin-bottom: 6px;
            font-weight: 600;
        }
        p {
            font-size: 12px;
            color: #b0b0b0;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .cards-grid {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 20px;
        }
        .card {
            flex: 1;
            background: rgba(45, 45, 45, 0.8);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            text-decoration: none;
            transition: transform 0.2s, border-color 0.2s;
        }
        .card:hover {
            transform: translateY(-3px);
            border-color: #d4af37;
        }
        .card img {
            width: 100%;
            height: 65px;
            object-fit: cover;
        }
        .card-title {
            font-size: 11px;
            padding: 6px 4px;
            color: #fff;
            line-height: 1.2;
        }
        .card-sub {
            font-size: 9px;
            color: #aaa;
        }
        .btn-browse {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7a2222 0%, #4a1212 100%);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            letter-spacing: 0.5px;
        }
        .btn-browse:hover {
            background: #d4af37;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <div class="logo"><img src="logo1.png" alt="Logo" style="max-width: 150px;"></div>
        <h2>ยินดีต้อนรับสู่ S1 LIVING ON YOUR STYLE</h2>
        <p>ขอให้ท่านมีความสุขกับการพักผ่อน<br>ข้อมูลเพิ่มเติม: สำรวจห้องพัก สิ่งอำนวยความสะดวก และบริการ</p>
        
        <div class="cards-grid">
            <a href="room-details.html" class="card">
                <img src="room.jpg" alt="Our Rooms">
                <div class="card-title">ห้องพักของเรา<br><span class="card-sub">(Our Rooms)</span></div>
            </a>
            <a href="amenities.html" class="card">
                <img src="amenities.jpg" alt="Amenities">
                <div class="card-title">สิ่งอำนวยความสะดวก<br><span class="card-sub">(Amenities)</span></div>
            </a>
            <a href="services.html" class="card">
                <img src="services.jpg" alt="Services">
                <div class="card-title">บริการของเรา<br><span class="card-sub">(Services)</span></div>
            </a>
        </div>

        <!-- ปุ่มกดเพื่อเริ่มใช้งานอินเทอร์เน็ตจริง (เชื่อมต่อตัวแปรระบบ MikroTik) -->
        <a href="$(link-orig)" class="btn-browse">ปิดหน้าต่าง/Close</a>
    </div>
</body>
</html>
