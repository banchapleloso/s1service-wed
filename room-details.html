<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องพักของเรา - S1 Living On Your Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.65);
        }
        .container {
            position: relative;
            background: rgba(30, 30, 30, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 25px 20px;
            width: 90%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 2;
        }
        .container img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
        h2 {
            font-size: 16px;
            color: #f3e5ab;
            margin-bottom: 12px;
            font-weight: 600;
        }
        p {
            color: #b0b0b0;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7a2222 0%, #4a1212 100%);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-back:hover {
            background: #d4af37;
            color: #1a1a1a;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h2>ห้องพักของเรา (Our Rooms)</h2>
        <img src="room.jpg" alt="Room">
        <p>รายละเอียดข้อมูลห้องพัก สิ่งอำนวยความสะดวกครบครัน บรรยากาศอบอุ่น เหมาะสำหรับการพักผ่อนของคุณ</p>
        <a href="index.html" class="btn-back">กลับหน้าหลัก / Back</a>
    </div>
</body>
</html>
