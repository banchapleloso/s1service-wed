<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ห้องพักของเรา - S1 Living On Your Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            padding: 20px 0;
        }
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); /* ปรับความเข้มเล็กน้อย */
            z-index: 1;
        }
        .container {
            position: relative;
            background: rgba(30, 30, 30, 0.9); /* ปรับความทึบเล็กน้อย */
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 30px 25px;
            width: 90%;
            max-width: 650px; /* ขยายความกว้างเพื่อให้ใส่ 4 รูปได้สวยงาม */
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        h2 {
            font-size: 18px;
            color: #f3e5ab;
            margin-bottom: 15px;
            font-weight: 600;
        }

        p {
            color: #b0b0b0;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        /* สไตล์ใหม่สำหรับแสดงรูป 4 รูป (Grid) */
        .room-images-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* แบ่งเป็น 2 คอลัมน์ */
            gap: 15px; /* ระยะห่างระหว่างรูป */
            margin-bottom: 20px;
        }

        .room-images-grid img {
            width: 100%;
            height: 140px; /* กำหนดความสูงของรูป */
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            transition: transform 0.3s ease; /* เพิ่มลูกเล่นเมื่อเอาเมาส์ชี้ */
        }

        .room-images-grid img:hover {
            transform: scale(1.05); /* ขยายรูปเล็กน้อยเมื่อชี้ */
        }

        .btn-back {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #7a2222 0%, #4a1212 100%);
            border: 1px solid #d4af37;
            color: #f3e5ab;
            font-size: 14px;
            font-weight: bold;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .btn-back:hover {
            background: #d4af37;
            color: #1a1a1a;
        }

        /* Responsive สำหรับหน้าจอขนาดเล็ก (มือถือ) */
        @media (max-width: 480px) {
            .container {
                width: 95%;
                padding: 20px 15px;
            }
            .room-images-grid {
                gap: 10px;
            }
            .room-images-grid img {
                height: 100px; /* ปรับลดความสูงบนมือถือ */
            }
            h2 { font-size: 16px; }
            p { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="container">
        <h2>ห้องพักของเรา (Our Rooms)</h2>
        
        <!-- ส่วนแสดงรูปภาพ 4 รูป (Grid) -->
        <div class="room-images-grid">
            <!-- แก้ไข src และ alt ตามชื่อไฟล์รูปภาพจริงของคุณ -->
            <img src="room.jpg" alt="มุมห้องนอน S1 Living">
            <img src="services.jpg" alt="มุมนั่งเล่นและทำงาน">
            <img src="6.jpg" alt="ห้องน้ำ S1 Living">
            <img src="10.jpg" alt="ระเบียงห้องพัก">
        </div>

        <p>รายละเอียดข้อมูลห้องพัก สิ่งอำนวยความสะดวกครบครัน บรรยากาศอบอุ่น เหมาะสำหรับการพักผ่อนของคุณ</p>
        <a href="index.html" class="btn-back">กลับหน้าหลัก / Back</a>
    </div>
</body>
</html>
